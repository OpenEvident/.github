name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you're trying to solve as well as the solution you have in mind; the problem is often more useful to us than the specific solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do, and what is stopping you today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include an example if it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about, and why they fall short.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that would help us evaluate this, such as links or screenshots.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
